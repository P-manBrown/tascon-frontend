name: Static Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn next typegen
      - run: yarn tsc --noEmit

  biome:
    name: biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn biome ci --error-on-warnings .

  knip:
    name: knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn knip

  markuplint:
    name: markuplint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn lint-jsx

  build:
    name: next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn next build --turbopack

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn markdownlint-cli2 '**/*.md'

  check-logger-trace:
    name: check-logger-trace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          status=0
          grep -rnF --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' 'logger.trace' src || status=$?
          if [ "$status" -eq 0 ]; then
            echo "ERROR: Remove 'logger.trace' from the files above."
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            exit "$status"
          fi

  check-docs:
    name: check-docs.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .lefthook/pre-commit/check-docs.sh

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the Semgrep rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: semgrep/semgrep-rules
          ref: 16b9e6d45f10649f6a531ec4838ed9924372c3bc
          path: .semgrep-rules
          sparse-checkout: |
            typescript/react
            typescript/lang
            javascript/react
            javascript/browser
            javascript/lang
          persist-credentials: false
      - name: Move the rules out of the workspace
        run: mv .semgrep-rules "$RUNNER_TEMP/semgrep-rules"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.18"
      - name: Install Semgrep
        run: python -m pip install --require-hashes -r .github/requirements/semgrep.txt
      - name: semgrep
        run: >-
          semgrep scan
          --config "$RUNNER_TEMP/semgrep-rules/typescript/react"
          --config "$RUNNER_TEMP/semgrep-rules/typescript/lang"
          --config "$RUNNER_TEMP/semgrep-rules/javascript/react"
          --config "$RUNNER_TEMP/semgrep-rules/javascript/browser"
          --config "$RUNNER_TEMP/semgrep-rules/javascript/lang"
          --metrics=off --error --exclude .yarn

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  vitest:
    name: vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: yarn vitest run --coverage

  checks:
    runs-on: ubuntu-latest
    needs: [typecheck, biome, knip, markuplint, build, markdownlint, check-logger-trace, check-docs, semgrep, dependency-review, vitest]
    if: always()
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" > /dev/null
