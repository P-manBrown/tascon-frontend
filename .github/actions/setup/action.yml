name: Setup
description: Set up Node.js and install dependencies with Yarn

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22.22.2
    - run: corepack enable
      shell: bash
    - run: yarn install --immutable
      shell: bash
