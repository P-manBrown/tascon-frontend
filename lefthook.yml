min_version: 2.0.0
pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{js,jsx,ts,tsx,json,jsonc}'
      run: yarn biome check --write --error-on-warnings {staged_files}
      stage_fixed: true
      fail_text: 'Read the report above.'
    markuplint:
      glob: 'src/**/*.{jsx,tsx}'
      run: yarn markuplint {staged_files}
      fail_text: 'Read the report above.'
    markdownlint:
      glob: '*.md'
      run: yarn markdownlint-cli2 {staged_files}
      fail_text: 'Read the report above.'
    check-logger-trace:
      glob: 'src/**/*.{js,jsx,ts,tsx}'
      run: grep -nFH 'logger.trace' {staged_files} && exit 1 || exit 0
      fail_text: "ERROR: Remove 'logger.trace' before committing."
    protect-branch:
      run: git branch --show-current | tee /dev/tty | grep -Eqvx 'main'
      fail_text: "ERROR: Do NOT commit directly to 'main' branch."
pre-push:
  commands:
    knip:
      run: yarn knip
      fail_text: 'Read the report above.'
    check-git-clean:
      run: test -z "$(git status --porcelain | tee /dev/tty)"
      fail_text: 'ERROR: Commit or stash changes before pushing.'
    tsc:
      run: yarn next typegen && yarn tsc --noEmit
      fail_text: 'Read the report above.'
    vitest-related:
      glob: '*.{ts,tsx}'
      run: yarn vitest related --run --passWithNoTests {push_files}
      fail_text: 'Read the report above.'
  jobs:
    - run: bash .lefthook/pre-commit/check-docs.sh
      glob:
        - "ARCHITECTURE.md"
        - "docs/*.md"
        - "docs/**/*.md"
      fail_text: 'Read the report above.'
